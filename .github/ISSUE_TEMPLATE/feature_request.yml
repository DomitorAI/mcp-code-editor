name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do today, and what is missing?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
      description: How should it work? Any examples or prior art help.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      validations:
        required: false
